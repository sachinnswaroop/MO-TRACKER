/* ===== Marketing Tracker visual refresh ===== */
:root{--navy:#0b3b78;--blue:#1769e8;--ink:#15233d;--muted:#6b7891;--surface:#fff;--bg:#f4f7fc;--line:#dfe6f1;--shadow:0 12px 30px rgba(24,55,100,.10)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
.sidebar{background:linear-gradient(180deg,#08366f 0%,#0a4f9d 58%,#08366f 100%);box-shadow:8px 0 24px rgba(0,35,80,.10)}
.sidebar .brand{padding:24px 18px 20px}.brand-mark{box-shadow:0 5px 18px rgba(0,0,0,.12)}
.nav-item{border-radius:12px;margin:4px 10px;padding:13px 14px;transition:.18s}.nav-item:hover{background:rgba(255,255,255,.10)}.nav-item.active{background:linear-gradient(90deg,#2479ee,#1760cf);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.topbar{background:rgba(255,255,255,.96);border-bottom:1px solid #e8edf5;box-shadow:0 3px 15px rgba(20,50,90,.04)}
.profile strong{font-size:17px}.profile small{color:#6d7a91}
.main{padding:22px 28px 36px;max-width:1600px;margin:auto}
.dashboard-hero{position:relative;overflow:hidden;min-height:132px;border:1px solid #dce8f7;border-radius:22px;padding:24px 30px;margin-bottom:18px;background:#eaf4ff url('/static/dashboard-banner.svg') right center/auto 100% no-repeat;box-shadow:var(--shadow)}

.dashboard-filters{display:grid;grid-template-columns:280px minmax(230px,1fr) minmax(210px,1fr);gap:12px;margin-bottom:18px}.filter-card{background:#fff;border:1px solid #e1e8f3;border-radius:16px;padding:10px 14px;box-shadow:0 5px 18px rgba(25,55,100,.06)}.filter-card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7a879d;font-weight:700;margin-bottom:5px}.filter-card select,.filter-card input{width:100%;border:0;background:transparent;color:#1d2c47;font-size:14px;font-weight:650;outline:none;padding:4px 0}.seg{background:#eef3fa;border-radius:12px;padding:4px;display:flex;gap:4px}.seg button{border:0;background:transparent;border-radius:9px;padding:8px 13px;color:#63718a;font-weight:700;cursor:pointer}.seg button.active{background:#1769e8;color:#fff;box-shadow:0 5px 12px rgba(23,105,232,.24)}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product-card{border:1px solid #e0e7f1;border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(24,55,100,.07);padding:18px;cursor:pointer;transition:transform .16s,box-shadow .16s}.product-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(24,55,100,.12)}.product-card.deposit{background:linear-gradient(135deg,#2d8bf4,#1670e6);color:#fff;border-color:#2d8bf4}.product-card.current{background:linear-gradient(135deg,#ffd968,#f7bd27);color:#17233c;border-color:#ffd968}.product-card.salary{background:linear-gradient(135deg,#f58aa0,#e95d7c);color:#fff;border-color:#f58aa0}.product-card.outline{background:#fff}.pc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.pc-title{font-size:17px;font-weight:800}.pc-icon{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.86);color:#1769e8;display:grid;place-items:center;font-size:21px;box-shadow:0 5px 12px rgba(0,0,0,.08)}.pc-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px;background:rgba(255,255,255,.88);color:#14233e;border-radius:12px;padding:12px}.pc-metric{min-width:0}.pc-metric+ .pc-metric{border-left:1px solid #e2e8f1;padding-left:10px}.pc-metric label{display:block;font-size:9px;text-transform:uppercase;color:#77849a;font-weight:800;letter-spacing:.05em}.pc-metric strong{display:block;font-size:20px;margin:2px 0}.pc-metric small{display:block;font-size:11px;color:#64718a;white-space:nowrap}.product-card.deposit .pc-metrics,.product-card.salary .pc-metrics{background:rgba(255,255,255,.95)}

.page-head .toolbar .btn{display:none}.quick-row{margin-top:16px}.amount-note{display:none}

.tab.active{background:var(--tab-color,var(--purple))!important;border-color:var(--tab-color,var(--purple))!important;color:#fff!important;box-shadow:0 5px 14px rgba(67,56,202,.18);transform:translateY(-1px)} .tab{cursor:pointer;transition:background .12s,border-color .12s,color .12s,transform .12s}.tab:hover{border-color:#aeb8ed}
.logged-in-mo{background:#fff3cd!important;box-shadow:inset 4px 0 0 #f2a72e}.logged-in-mo td:nth-child(2){color:#a25d00}.you-badge{display:inline-block;margin-left:5px;padding:2px 5px;border-radius:8px;background:#f2a72e;color:#fff;font-size:8px;font-weight:800}
@media(max-width:900px){.daily-performance{grid-column:1/-1}.hamb{display:block}}
@media(max-width:640px){.daily-bars{gap:3px}.daily-stack{gap:1px}.daily-bar-wrap{width:7px}.daily-bar{width:6px}.daily-product-select{max-width:150px}.legend-grid{grid-template-columns:1fr}.simple-bar-row{grid-template-columns:100px 1fr 20px}}


.mo-logo{width:58px;height:58px;border-radius:16px;object-fit:cover;display:block;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.14)}.brand-logo-wrap{display:flex;align-items:center;justify-content:center;flex:none}.logo-fallback{display:none;width:58px;height:58px;border-radius:16px;background:#fff;color:#1769e8;font-weight:900;font-size:20px;place-items:center;box-shadow:0 5px 18px rgba(0,0,0,.14)}.sidebar .brand-logo-wrap{width:58px}.loginbox .brand-logo-wrap{width:68px}.loginbox .mo-logo{width:68px;height:68px;border-radius:18px}.loginbox .logo-fallback{width:68px;height:68px;border-radius:18px}.pending-nav-icon{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:inline-grid;place-items:center;font-size:12px;line-height:1}.pending-nav-icon:after{content:'✓';font-size:11px}.pending-head-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pending-table .table{min-width:860px}
/* ===== Supplied icon sheet integration ===== */
.nav-icon{width:24px;height:24px;display:grid;place-items:center;flex:none;font-size:0}
.nav-icon-img{width:22px;height:22px;object-fit:contain;display:block;filter:brightness(0) invert(1)}
.pc-icon{display:grid;place-items:center;overflow:hidden}
.pc-icon-img{width:30px;height:30px;max-width:30px;max-height:30px;object-fit:contain;display:block}
/* Keep the View By control inside its card on desktop/tablet */
.view-filter .seg{width:100%;gap:3px}
.view-filter .seg button{flex:1;min-width:0;padding-left:8px;padding-right:8px;white-space:nowrap;font-size:14px}
.dashboard-filters{grid-template-columns:minmax(320px,1fr) minmax(300px,1.45fr) minmax(240px,1fr)}
@media(max-width:1000px){.dashboard-filters{grid-template-columns:1fr 1fr}.view-filter{grid-column:1/-1}}
@media(max-width:640px){.dashboard-filters{grid-template-columns:1fr}.view-filter{grid-column:auto}.view-filter .seg button{font-size:13px;padding-left:6px;padding-right:6px}.nav-icon-img{width:21px;height:21px}.pc-icon-img{width:28px;height:28px}}

/* Product/sub-product dashboard and report filters */
.dashboard-filters{grid-template-columns:minmax(280px,1fr) minmax(250px,1fr) minmax(230px,1fr) minmax(230px,1fr)}
.report-filter-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px;margin-bottom:14px}.report-filter-grid .filter-card{min-width:0}

const iconImg=(key,cls='')=>key==='pending'?`<span class="pending-nav-icon ${cls}"></span>`:(ICONS[key]?`<img class="${cls}" src="${ICONS[key]}" alt="">`:'');

const reportItems=['Deposits','Retail','Government Scheme','MSME','Agriculture','Insurance','Mutual Fund','Builder Tie-up','Dealer Tie-up','Savings','Current','Salary','TASC','Other Deposits','Home Loan','Vehicle Loan','Education/Personal Loan','Retails','Other Loans','3rd Party'];
const reportCategories=['All Products',...reportItems];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=x=>x?new Date(x+'T00:00:00').toLocaleDateString('en-GB'):'';
const money=x=>Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?((Number(a||0)/Number(b||0))*100).toFixed(1)+'%':'0.0%';
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`Request failed (${r.status})`);return d}
async function doLogin(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})});state.me=d;await boot()}catch(e){loginMsg.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function boot(){
 loginScreen.classList.add('hidden');app.classList.remove('hidden');welcome.textContent=state.me.mo_name||state.me.username;roleLabel.textContent=state.me.role==='mo'?`Marketing Officer${state.me.cac?' | '+state.me.cac:''}`:state.me.role==='administrator'?'Administrator':'Admin';avatar.textContent=(state.me.mo_name||state.me.username||'CB').slice(0,2).toUpperCase();buildNav();await showPage('dashboard');loadNoticeCount()}
function buildNav(){const mo=state.me.role==='mo',admin=state.me.role==='admin',administrator=state.me.role==='administrator';const items=[['dashboard','dashboard','Dashboard'],...(mo?[['activity','activity','MO Activity','›']]:((admin||administrator)?[['activity','activity','MO Activity','›']]:[])),['reports','report','Report','›'],['pending','pending','Pending Leads','›'],['notifications','notification','Notification'],...((admin||administrator)?[...(admin?[['upload','upload','Upload']]:[]),['co','report','CO Report','›'],...(admin?[['targets','targets','Targets','›'],['users','users','User Management','›']]:[])]:[]),['password','account','Account','›'],['logout','logout','Logout']];nav.innerHTML=items.map(x=>`<button class="nav-item" data-page="${x[0]}" onclick="showPage('${x[0]}')"><span class="nav-icon">${iconImg(x[1],'nav-icon-img')}</span><span>${x[2]}</span>${x[0]==='notifications'?'<span class="nav-notice-badge" id="navNoticeBadge">0</span>':''}${x[3]?`<span class="nav-chevron">${x[3]}</span>`:''}</button>`).join('')}
async function showPage(p){if(p==='logout'){await api('/api/logout',{method:'POST'});location.reload();return}if(state.currentPage!==p){state.previousPage=state.currentPage;state.currentPage=p}document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('sidebar').classList.remove('open');if(p==='dashboard')return loadDashboard();if(p==='activity')return renderActivity();if(p==='reports')return renderReports();if(p==='pending')return renderPendingLeads();if(p==='notifications')return renderNotifications();if(p==='upload')return renderUpload();if(p==='co')return renderCO();if(p==='targets')return renderTargets();if(p==='users')return renderUsers();if(p==='password')return renderPassword()}
function toggleSidebar(){document.getElementById('app').classList.toggle('sidebar-collapsed');document.getElementById('sidebar').classList.toggle('open')}
function goHome(){showPage('dashboard')}
function goBack(){if(state.currentPage!=='dashboard'&&state.previousPage&&state.previousPage!==state.currentPage){showPage(state.previousPage)}else{showPage('dashboard')}}
function globalFilter(q){if(!q)return;const el=document.querySelector('.table tbody');if(!el)return;el.querySelectorAll('tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function head(title,sub,tools=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="toolbar"><button class="btn page-nav" onclick="goHome()" title="Home">⌂</button><button class="btn page-nav" onclick="goBack()" title="Back">←</button>${tools}</div></div>`}
function dashboardSubcategoryOptions(items){const opts=[{value:'All Sub-products',label:'All Sub-products'},...(items||[])];return opts.map(x=>`<option value="${esc(x.value)}" ${state.dashboardSubproduct===x.value?'selected':''}>${esc(x.label)}</option>`).join('')}
function setDashboardProduct(value){state.productFilter=value;state.dashboardSubproduct='All Sub-products';loadDashboard()}
function setDashboardSubproduct(value){state.dashboardSubproduct=value;loadDashboard()}
function controls(){const months=state.availableMonths||[];const monthValue=(state.date||'').slice(0,7);const monthLabel=m=>{const d=new Date(m+'-01T00:00:00');return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});};const subs=state.dashboardSubcategories||[];return `<div class="dashboard-filters"><div class="filter-card view-filter"><label>View By</label><div class="seg"><button class="fast-action ${state.mode==='monthly'?'active':''}" onclick="setDashboardMode('monthly')">Monthly</button><button class="fast-action ${state.mode==='daily'?'active':''}" onclick="setDashboardMode('daily')">Daily</button><button class="fast-action ${state.mode==='cumulative'?'active':''}" onclick="setDashboardMode('cumulative')">Cumulative</button></div></div><div class="filter-card"><label>${state.mode==='daily'?'Date':state.mode==='monthly'?'Month':'Cumulative To'}</label>${state.mode==='monthly'?`<select onchange="state.date=this.value+'-01';loadDashboard()">${months.map(m=>`<option value="${m}" ${m===monthValue?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>`:`<input type="date" value="${state.date||''}" max="${state.availableMaxDate||''}" onchange="state.date=this.value;loadDashboard()">`}</div><div class="filter-card"><label>Product Category</label><select onchange="setDashboardProduct(this.value)"><option value="All Products">All Products</option>${productCards.map(p=>`<option value="${p.key}" ${state.productFilter===p.key?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="filter-card"><label>Sub Category</label><select onchange="setDashboardSubproduct(this.value)">${dashboardSubcategoryOptions(subs)}</select></div></div>`}
function setDashboardMode(mode){if(state.mode===mode)return;state.mode=mode;loadDashboard()}
function cardHtml(p,r){const cardIcon=({Savings:'savings',Current:'current',Salary:'salary','Home Loan':'home','Vehicle Loan':'vehicle','Education/Personal Loan':'education','Retails':'retail',MSME:'msme',Agriculture:'agriculture',Insurance:'insurance'})[p.key];return `<div class="product-card ${p.cls}" onclick="openProduct('${esc(p.key)}','${esc(p.name)}')"><div class="pc-top"><div><div class="pc-title">${p.name}</div><div style="font-size:11px;opacity:.78;margin-top:3px">Marketing performance</div></div><div class="pc-icon">${iconImg(cardIcon,'pc-icon-img')}</div></div><div class="pc-metrics"><div class="pc-metric"><label>Leads</label><strong>${r?.total_leads??0}</strong><small>₹ ${money(r?.lead_amount_lakh)}</small></div><div class="pc-metric"><label>Converted</label><strong>${r?.converted??0}</strong><small>₹ ${money(r?.converted_actual_amount_lakh)}</small></div><div class="pc-metric"><label>Pending</label><strong>${r?.pending??0}</strong><small>₹ ${money(r?.pending_amount_lakh)}</small></div></div></div>`}
const chartColors={Savings:'#2778e8',Current:'#f2a72e',Salary:'#ef5a79',TASC:'#8a65d6','Other Deposits':'#21a873',Deposits:'#1769e8','Home Loan':'#5b55e7','Vehicle Loan':'#00a6a6','Education/Personal Loan':'#f59a23',Retails:'#d95f59','Other Loans':'#7b61a8','3rd Party':'#4c78a8',MSME:'#7b61a8',Agriculture:'#2ca25f',Insurance:'#ef5a79'};
function leadShareHtml(wanted,map){const vals=wanted.map(p=>Number(map[p.key]?.total_leads||0));const total=vals.reduce((a,b)=>a+b,0);let acc=0;const parts=[];wanted.forEach((p,i)=>{const pctv=total?vals[i]/total*100:0;if(pctv>0){const c=chartColors[p.name]||chartColors[p.key]||'#6b7280';parts.push(`${c} ${acc}% ${acc+pctv}%`);acc+=pctv}});const gradient=parts.length?`conic-gradient(${parts.join(',')})`:'#e6e9f0';return `<div class="donut" style="background:${gradient}"></div><div class="legend-grid">${wanted.map(p=>`<div class="legend-item"><span class="legend-dot" style="background:${chartColors[p.name]||chartColors[p.key]||'#6b7280'}"></span><span>${esc(p.name)}</span><b>${total?((Number(map[p.key]?.total_leads||0)/total)*100).toFixed(1):'0.0'}%</b></div>`).join('')}</div>`}
function dailyBarsHtml(rows){const max=Math.max(1,...rows.flatMap(r=>[r.leads,r.converted,r.pending,r.rejection]));return `<div class="daily-legend"><span><i class="legend-dot lead-dot"></i>Leads Generated</span><span><i class="legend-dot conv-dot"></i>Converted</span><span><i class="legend-dot pending-dot"></i>Pending</span><span><i class="legend-dot reject-dot"></i>Rejection</span></div><div class="daily-bars">${rows.map(r=>`<div class="daily-day"><div class="daily-stack">${[['leads','lead'],['converted','conv'],['pending','pending'],['rejection','reject']].map(x=>`<div class="daily-bar-wrap"><span>${r[x[0]]}</span><div class="daily-bar ${x[1]}" style="height:${Math.max(r[x[0]]?4:1,(r[x[0]]/max)*110)}px"></div></div>`).join('')}</div><small>${esc(r.label)}</small></div>`).join('')}</div>`}
async function loadDashboard(){const mainEl=document.getElementById('main');mainEl.classList.add('dashboard-loading');try{const d=await api(`/api/dashboard-data?mode=${state.mode}&report_date=${encodeURIComponent(state.date||'')}&product=${encodeURIComponent(state.productFilter||'All Products')}&subproduct=${encodeURIComponent(state.dashboardSubproduct||'All Sub-products')}`);state.availableMonths=d.months||[];state.dashboardSubcategories=d.subcategories||[];if(state.dashboardSubproduct!=='All Sub-products'&&!state.dashboardSubcategories.some(x=>x.value===state.dashboardSubproduct)){state.dashboardSubproduct='All Sub-products';return loadDashboard();}state.availableMaxDate=d.max_date;if(!state.date)state.date=d.max_date;if(state.mode==='monthly'&&!state.availableMonths.includes(state.date.slice(0,7)))state.date=(state.availableMonths.at(-1)||d.max_date.slice(0,7))+'-01';const wanted=state.productFilter&&state.productFilter!=='All Products'?productCards.filter(p=>p.key===state.productFilter):productCards;const rawMap={};(d.cards||[]).forEach(x=>rawMap[x.category]=x.summary||{});const map={};wanted.forEach(p=>map[p.key]=rawMap[p.key]||{});const periodLabel=state.mode==='monthly'?new Date(state.date+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'}):state.mode==='daily'?fmt(state.date):`Up to ${fmt(state.date)}`;const displayName=state.me?.mo_name||state.me?.username||'Marketing Officer';state.lastUpdated=d.last_updated||null;const daily=await api(`/api/daily-performance?product=${encodeURIComponent(state.dailyProduct||'All Products')}&report_date=${encodeURIComponent(state.date)}`);let html=`<div class="dashboard-hero"><h1>Good Evening, <span class="hero-name">${esc(displayName)}</span></h1><p>Here’s your marketing performance at a glance • <b>${esc(periodLabel)}</b></p></div>${controls()}<div class="dashboard-grid">`;wanted.forEach(p=>html+=cardHtml(p,map[p.key]||null));html+=`<div class="daily-performance summary-card"><div class="summary-title"><span>Daily Performance</span><select class="daily-product-select" onchange="state.dailyProduct=this.value;loadDailyPerformance()"><option value="All Products" ${state.dailyProduct==='All Products'?'selected':''}>All Products</option>${productCards.map(p=>`<option value="${p.key}" ${state.dailyProduct===p.key?'selected':''}>${p.name}</option>`).join('')}</select></div><div id="dailyPerformanceBody">${dailyBarsHtml(daily.rows)}</div></div></div>`;html+=`<div class="dashboard-summary"><div class="summary-card"><div class="summary-title">Product-wise Lead Share</div>${leadShareHtml(wanted,map)}</div><div class="summary-card"><div class="summary-title">Product-wise Lead Pending</div><div class="simple-bars">${wanted.map(p=>{const v=Number(map[p.key]?.pending||0);const mx=Math.max(1,...wanted.map(x=>Number(map[x.key]?.pending||0)));return `<div class="simple-bar-row"><span>${esc(p.name)}</span><div><i style="width:${(v/mx)*100}%;background:${chartColors[p.name]||'#f59a23'}"></i></div><b>${v}</b></div>`}).join('')}</div><div class="legend-note">Each bar colour identifies the product shown in the graph.</div></div><div class="summary-card"><div class="summary-title">Product-wise Rejection</div><div class="simple-bars">${wanted.map(p=>{const v=Number(map[p.key]?.rejected||0);const mx=Math.max(1,...wanted.map(x=>Number(map[x.key]?.rejected||0)));return `<div class="simple-bar-row"><span>${esc(p.name)}</span><div><i style="width:${(v/mx)*100}%;background:${chartColors[p.name]||'#ef5a79'}"></i></div><b>${v}</b></div>`}).join('')}</div><div class="legend-note">Each bar colour identifies the product; rejection includes Non Converted, Not Interested and Rejected statuses.</div></div></div><div class="last-updated">Last updated on ${esc(state.lastUpdated||'Not available')}</div>`;main.innerHTML=html}catch(e){main.innerHTML=`${head('Dashboard','Marketing performance')}<div class="alert">${esc(e.message)}</div>`}finally{mainEl.classList.remove('dashboard-loading')}}
async function loadDailyPerformance(){const el=document.getElementById('dailyPerformanceBody');if(!el)return;try{el.innerHTML='<div class="muted">Loading…</div>';const d=await api(`/api/daily-performance?product=${encodeURIComponent(state.dailyProduct||'All Products')}&report_date=${encodeURIComponent(state.date)}`);el.innerHTML=dailyBarsHtml(d.rows)}catch(e){el.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function openProduct(key,title){try{const d=await api(`/api/category-report?category=${encodeURIComponent(key)}&mode=${state.mode}&report_date=${state.date}`);let html=head(title,`${state.mode==='monthly'?'Monthly':'Cumulative'} • ${fmt(d.start)} to ${fmt(d.end)}`,'');html+=`<div class="page-card"><div class="mini-grid"><div class="mini-card"><small>Leads</small><strong>${d.summary.total_leads}</strong><span>₹ ${money(d.summary.lead_amount_lakh)}</span></div><div class="mini-card"><small>Converted</small><strong>${d.summary.converted}</strong><span>₹ ${money(d.summary.converted_actual_amount_lakh)}</span></div><div class="mini-card"><small>Pending</small><strong>${d.summary.pending}</strong><span>₹ ${money(d.summary.pending_amount_lakh)}</span></div></div></div>`;html+=`<div class="page-card" style="margin-top:16px"><div class="section-title"><h2>Sub-product performance</h2></div>${fullTable(d.subproducts,[['subproduct','Sub-product'],['total_leads','Leads'],['lead_amount_lakh','Lead Amount'],['converted','Converted'],['converted_actual_amount_lakh','Converted Amount'],['pending','Pending'],['pending_amount_lakh','Pending Amount']])}</div>`;main.innerHTML=html}catch(e){main.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
function fullTable(rows,cols){if(!rows?.length)return '<div class="empty">No records for the selected period.</div>';return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th class="${c[0].toLowerCase().includes('amount')?'amount-cell':''}">${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>{const key=c[0].toLowerCase(),v=r[c[0]];const display=key.includes('date')&&v?fmt(v):typeof v==='number'&&key.includes('amount')?'₹ '+money(v):typeof v==='number'&&key.includes('pct')?Number(v).toFixed(1)+'%':esc(v);return `<td class="${key.includes('amount')?'amount-cell':''}">${display}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function reportControls(load='loadReports'){return `<div class="seg"><button class="${state.mode==='monthly'?'active':''}" onclick="state.mode='monthly';${load}()">Monthly</button><button class="${state.mode==='cumulative'?'active':''}" onclick="state.mode='cumulative';${load}()">Cumulative</button></div><input class="control" type="date" value="${state.date}" onchange="state.date=this.value;${load}()">`}
function reportCategoryOptions(){return reportCategories.map(x=>`<option value="${esc(x)}" ${state.reportCategory===x?'selected':''}>${esc(x)}</option>`).join('')}
function reportSubproductOptions(items){const opts=[{value:'All Sub-products',label:'All Sub-products'},...(items||[])];return opts.map(x=>`<option value="${esc(x.value)}" ${state.reportSubproduct===x.value?'selected':''}>${esc(x.label)}</option>`).join('')}
function renderReportFilters(subs=[]){return `<div class="report-filter-grid"><div class="filter-card"><label>Product Category</label><select id="reportCategorySelect" onchange="state.reportCategory=this.value;state.reportSubproduct='All Sub-products';loadCategoryReport()">${reportCategoryOptions()}</select></div><div class="filter-card"><label>Sub Category</label><select id="reportSubproductSelect" onchange="state.reportSubproduct=this.value;loadCategoryReport()">${reportSubproductOptions(subs)}</select></div></div>`}
function updateReportSubproducts(subs){const el=document.getElementById('reportSubproductSelect');if(!el)return;const current=state.reportSubproduct;el.innerHTML=reportSubproductOptions(subs);if(![...el.options].some(o=>o.value===current)){state.reportSubproduct='All Sub-products';el.value='All Sub-products'}}
function renderReports(){main.innerHTML=head('Report','Monthly and cumulative performance',reportControls('loadCategoryReport'))+`<div class="page-card">${renderReportFilters()}<div id="reportBody"></div></div>`;loadCategoryReport()}
async function loadCategoryReport(){const b=document.getElementById('reportBody');if(!b)return;b.innerHTML='<div class="muted" style="padding:18px">Loading…</div>';try{const d=await api(`/api/category-report?category=${encodeURIComponent(state.reportCategory)}&subproduct=${encodeURIComponent(state.reportSubproduct)}&mode=${state.mode}&report_date=${state.date}`);updateReportSubproducts(d.subcategories||[]);b.innerHTML=`${state.mode==='monthly'?`<div class="tabs" style="margin-top:14px">${d.months.map(m=>`<button class="tab ${state.date.startsWith(m)?'active':''}" onclick="state.date='${m}-01';loadCategoryReport()">${new Date(m+'-01T00:00:00').toLocaleDateString('en-US',{month:'long',year:'2-digit'})}</button>`).join('')}</div>`:''}<div class="report-head"><div class="period">${state.mode==='monthly'?'Monthly':'Cumulative'}: ${fmt(d.start)} to ${fmt(d.end)}</div><div><button class="btn small" onclick="downloadCategory('excel')">Excel</button><button class="btn small primary" onclick="downloadCategory('pdf')">PDF</button></div></div>${fullTable(d.subproducts,[['category','Product Category'],['subproduct','Sub-product'],['total_leads','Leads'],['lead_amount_lakh','Lead Amount'],['converted','Converted'],['converted_actual_amount_lakh','Converted Amount'],['pending','Pending'],['pending_amount_lakh','Pending Amount']])}<div style="margin-top:15px">${fullTable(d.statuses,[['status','Status'],['number','No.'],['amount_lakh','Lead Amount'],['actual_number','Actual No.'],['actual_amount_lakh','Actual Amount']])}</div>`}catch(e){b.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function downloadCategory(kind){const u=`/download/category-${kind}?category=${encodeURIComponent(state.reportCategory)}&subproduct=${encodeURIComponent(state.reportSubproduct)}&mode=${state.mode}&report_date=${encodeURIComponent(state.date||'')}`;await downloadBlob(u,`Marketing_Report_${state.mode}.${kind==='pdf'?'pdf':'xlsx'}`)}
function pendingCategoryOptions(){return reportCategories.map(x=>`<option value="${esc(x)}" ${state.pendingCategory===x?'selected':''}>${esc(x)}</option>`).join('')}
function pendingSubproductOptions(items){const opts=[{value:'All Sub-products',label:'All Sub-products'},...(items||[])];return opts.map(x=>`<option value="${esc(x.value)}" ${state.pendingSubproduct===x.value?'selected':''}>${esc(x.label)}</option>`).join('')}
function pendingModeControls(){return `<div class="seg"><button class="${state.mode==='monthly'?'active':''}" onclick="state.mode='monthly';loadPendingLeads()">Monthly</button><button class="${state.mode==='daily'?'active':''}" onclick="state.mode='daily';loadPendingLeads()">Daily</button><button class="${state.mode==='cumulative'?'active':''}" onclick="state.mode='cumulative';loadPendingLeads()">Cumulative</button></div><input class="control" type="date" value="${state.date||''}" onchange="state.date=this.value;loadPendingLeads()">`}
function renderPendingLeads(){main.innerHTML=head('Pending Leads','Open and Under Process leads',pendingModeControls())+`<div class="page-card"><div class="report-filter-grid"><div class="filter-card"><label>Product Category</label><select id="pendingCategorySelect" onchange="state.pendingCategory=this.value;state.pendingSubproduct='All Sub-products';loadPendingLeads()">${pendingCategoryOptions()}</select></div><div class="filter-card"><label>Sub Category</label><select id="pendingSubproductSelect" onchange="state.pendingSubproduct=this.value;loadPendingLeads()"><option>Loading…</option></select></div></div><div id="pendingBody"></div></div>`;loadPendingLeads()}
function updatePendingSubproducts(items){const el=document.getElementById('pendingSubproductSelect');if(!el)return;const current=state.pendingSubproduct;el.innerHTML=pendingSubproductOptions(items);if(![...el.options].some(o=>o.value===current)){state.pendingSubproduct='All Sub-products';el.value='All Sub-products'}}
async function loadPendingLeads(){const b=document.getElementById('pendingBody');if(!b)return;b.innerHTML='<div class="muted" style="padding:18px">Loading…</div>';try{const d=await api(`/api/pending-leads?category=${encodeURIComponent(state.pendingCategory)}&subproduct=${encodeURIComponent(state.pendingSubproduct)}&mode=${state.mode}&report_date=${encodeURIComponent(state.date||'')}`);if(!state.date)state.date=d.max_date;updatePendingSubproducts(d.subcategories||[]);const rows=d.rows||[];const table=rows.length?fullTable(rows,[['product_name','Product Name'],['number','Number'],['amount_lakh','Amount (Lakh)'],['region','Region'],['branch','Branch'],['assigned_date','Assigned Date']]):'<div class="empty">No pending leads found for the selected period and category.</div>';b.innerHTML=`${state.mode==='monthly'&&d.months?.length?`<div class="tabs" style="margin:0 0 14px">${d.months.map(m=>`<button class="tab ${String(state.date).startsWith(m)?'active':''}" onclick="state.date='${m}-01';loadPendingLeads()">${new Date(m+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</button>`).join('')}</div>`:''}<div class="report-head"><div><b>${state.mode==='daily'?'Daily':state.mode==='monthly'?'Monthly':'Cumulative'} Pending Leads</b><div class="muted">${fmt(d.start)} to ${fmt(d.end)} • Status: Open + Under Process</div></div><div class="pending-head-tools"><button class="btn small" onclick="downloadPending('excel')">Excel</button><button class="btn small primary" onclick="downloadPending('pdf')">PDF</button></div></div><div class="pending-table">${table}</div>`}catch(e){b.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
function downloadPending(kind){const u=`/download/pending-${kind}?category=${encodeURIComponent(state.pendingCategory)}&subproduct=${encodeURIComponent(state.pendingSubproduct)}&mode=${state.mode}&report_date=${encodeURIComponent(state.date||'')}`;window.location.href=u;}

function renderUpload(){main.innerHTML=head('Upload Excel','Only Admin can upload the master lead file')+`<div class="page-card" style="max-width:700px"><div class="field"><label>Select Excel file</label><input id="excelFile" type="file" accept=".xlsx,.xls"></div><button class="btn primary" onclick="uploadExcel()">Upload Excel</button><div id="uploadMsg" style="margin-top:14px"></div></div>`}

async function loadAdminMOActivity(firstLoad=false){
const date=adminActDate.value;const mo=adminActMO.value;const show=adminActShow.value;const focus=adminActFocus.value;const body=document.getElementById('adminActivityBody');
try{
const d=await api(`/api/admin/mo-activity?date=${encodeURIComponent(date)}&mo=${encodeURIComponent(mo)}&show=${encodeURIComponent(show)}&focus=${encodeURIComponent(focus)}`);
if(firstLoad||adminActMO.options.length===1){const old=mo||'All Officers';adminActMO.innerHTML='<option value="All Officers">All Officers</option>'+(d.officers||[]).map(x=>`<option value="${esc(x.user_id)}">${esc(x.user_id)} — ${esc(x.mo_name)} (${esc(x.cac)})</option>`).join('');adminActMO.value=old}
const s=d.status||[];
const planned=s.filter(x=>x.tour_plan==='Planned').length;const reported=s.filter(x=>x.tour_report==='Reported').length;const coReported=s.filter(x=>x.co_report==='Reported').length;const coPartial=s.filter(x=>x.co_report==='Partial').length;const coNot=s.filter(x=>x.co_report==='Not Reported').length;
body.innerHTML=`<div class="mini-grid" style="margin-bottom:18px"><div class="mini-card"><small>Tour Plans</small><strong>${planned}</strong></div><div class="mini-card"><small>Daily Tour Reports</small><strong>${reported}</strong></div><div class="mini-card"><small>CO Reported</small><strong>${coReported}</strong></div><div class="mini-card"><small>CO Partial</small><strong>${coPartial}</strong></div><div class="mini-card"><small>CO Not Reported</small><strong>${coNot}</strong></div></div>
<div class="section-card"><div class="section-title"><h2>Daily Monitoring Status</h2><span class="muted">${date?fmt(date):'All selected dates'}${show==='no'?' • Showing Not Done':''}</span></div>${s.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>MO Name</th><th>CAC</th><th>Tour Plan</th><th>Daily Tour Report</th><th>CO Reporting Status</th></tr></thead><tbody>${s.map(r=>`<tr><td>${fmt(r.date)}</td><td>${esc(r.mo_name)}</td><td>${esc(r.cac)}</td><td>${esc(r.tour_plan)}</td><td>${esc(r.tour_report)}</td><td><b>${esc(r.co_report)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity records found for the selected filters.</div>'}</div>
<div class="tabs" style="margin-top:18px"><button class="tab active" onclick="adminActivityDetail('plans',this)">Tour Plans</button><button class="tab" onclick="adminActivityDetail('reports',this)">Daily Tour Reports</button><button class="tab" onclick="adminActivityDetail('co',this)">CO Reports</button></div><div id="adminActivityDetail"></div>`;
window.adminActivityData=d;adminActivityDetail('plans',document.querySelectorAll('#adminActivityBody .tabs .tab')[0]);
}catch(e){body.innerHTML=`<div class="alert">${esc(e.message)}</div>`}
}

async function downloadAdminActivity(type,kind){
const q=`report_type=${encodeURIComponent(type)}&date=${encodeURIComponent(adminActDate.value||'')}&mo=${encodeURIComponent(adminActMO.value||'All Officers')}&show=${encodeURIComponent(adminActShow.value||'all')}&focus=${encodeURIComponent(adminActFocus.value||'all')}`;
try{
 const r=await fetch(`/download/admin-activity-${kind}?${q}`,{credentials:'same-origin'});
 if(!r.ok){const txt=await r.text();throw new Error(txt||`Download failed (${r.status})`)}
 const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download=kind==='pdf'?(type==='monitoring'?'Daily_Monitoring_Status.pdf':type==='tour_plan'?'Tour_Plans.pdf':type==='tour_report'?'Daily_Tour_Reports.pdf':'CO_Reports.pdf'):(type==='monitoring'?'Daily_Monitoring_Status.xlsx':type==='tour_plan'?'Tour_Plans.xlsx':type==='tour_report'?'Daily_Tour_Reports.xlsx':'CO_Reports.xlsx');
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);
}catch(e){alert(`Download failed: ${e.message}`)}
}

function adminActivityDetail(type,btn){

let rows=[],cols=[],title='';

if((d.show||'all')==='no'&&(d.focus==='tour_plan'||d.focus==='all')&&d.status){rows=d.status.filter(x=>x.tour_plan==='Not Planned').map(x=>({date:x.date,mo_name:x.mo_name,cac:x.cac,category:'',plan:'Not Planned'}))}}
if(type==='reports'){rows=d.tour_reports||[];cols=[['date','Date'],['mo_name','MO Name'],['cac','CAC'],['home_loan_no','Home Loan No.'],['home_loan_amt','Home Loan Amt.'],['vehicle_loan_no','Vehicle Loan No.'],['vehicle_loan_amt','Vehicle Loan Amt.'],['other_retail_no','Other Retail No.'],['other_retail_amt','Other Retail Amt.'],['builder_tieup','Builder Tie-up'],['dealer_tieup','Dealer Tie-up'],['deposits_no','Deposits No.'],['deposits_amt','Deposits Amt.'],['third_party_no','3rd Party No.'],['third_party_amt','3rd Party Amt.']];title='Daily Tour Reports';
if((d.show||'all')==='no'&&(d.focus==='tour_report'||d.focus==='all')&&d.status){rows=d.status.filter(x=>x.tour_report==='Not Reported').map(x=>({date:x.date,mo_name:x.mo_name,cac:x.cac,home_loan_no:0,home_loan_amt:0,vehicle_loan_no:0,vehicle_loan_amt:0,other_retail_no:0,other_retail_amt:0,builder_tieup:0,dealer_tieup:0,deposits_no:0,deposits_amt:0,third_party_no:0,third_party_amt:0}))}}
if(type==='co'){rows=d.co_reports||[];cols=[['date','Date'],['mo_name','MO Name'],['cac','CAC'],['lms','LMS Updation'],['google_form','Google Form']];title='CO Reports';
if((d.show||'all')==='no'&&(d.focus==='co_report'||d.focus==='all')&&d.status){rows=d.status.filter(x=>x.co_report!=='Reported').map(x=>{const c=(d.co_reports||[]).find(z=>z.user_id===x.user_id&&z.date===x.date)||{};return {date:x.date,mo_name:x.mo_name,cac:x.cac,lms:c.lms||'No',google_form:c.google_form||'No'}})}}
const el=document.getElementById('adminActivityDetail');el.innerHTML=`<div class="section-card" style="margin-top:14px"><div class="section-title"><h2>${title}</h2><div><button class="btn small" onclick="downloadAdminActivity('${type==='plans'?'tour_plan':type==='reports'?'tour_report':'co'}','excel')">Excel</button><button class="btn small primary" onclick="downloadAdminActivity('${type==='plans'?'tour_plan':type==='reports'?'tour_report':'co'}','pdf')">PDF</button></div></div>${rows.length?fullTable(rows,cols):'<div class="empty">No records found.</div>'}</div>`;
}

async function activityTab(type,btn){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');const b=document.getElementById('activityBody');if(type==='plan'){b.innerHTML=`<div class="activity-grid"><div class="page-card"><h2>Plan today's / tomorrow's tour</h2><div class="form-grid"><div class="field"><label>Date</label><input id="tpDate" type="date"></div></div><div id="tourPlanCategories"></div><button class="btn primary" onclick="saveTourPlan()">Save Tour Plan</button><div id="tpMsg" style="margin-top:10px"></div></div><div class="page-card"><h2>Category guide</h2><div class="notice"><b>Liability:</b> Savings, Current, Salary, TASC & Other Deposits<br><br><b>Loans:</b> Home Loan, Vehicle Loan, Education/Personal Loan, MSME, Other Loans<br><br><b>Govt. Business:</b> Government business and related institutions / departments<br><br><b>3rd Party:</b> Insurance, mutual fund and other third-party activities.</div></div></div>`;tpDate.value=new Date().toISOString().slice(0,10);renderTourPlanCategories();await loadActivityHistory('tour_plans')}else if(type==='tour'){b.innerHTML=`<div class="page-card"><h2>Daily Tour Reporting</h2><p class="muted">Amounts are in Lakh. If Lead No. is 1 or more, Lead Amount must be greater than 0; if Lead Amount is entered, Lead No. must be 1 or more.</p><div class="form-grid three">${[['home_loan','Home Loan'],['vehicle_loan','Vehicle Loan'],['other_retail','Other Retail Loan'],['deposits','Deposits'],['third_party','3rd Party']].map(x=>`<div><div class="field"><label>${x[1]} Lead No.</label><input id="${x[0]}_no" type="number" min="0" step="1" value="0"></div><div class="field"><label>${x[1]} Lead Amount</label><input id="${x[0]}_amt" type="number" min="0" step="0.01" value="0"></div></div>`).join('')}</div><div class="form-grid"><div class="field"><label>Builder Tie-up Number</label><input id="builder_tieup" type="number" min="0" value="0"></div><div class="field"><label>Dealer Tie-up Number</label><input id="dealer_tieup" type="number" min="0" value="0"></div><div class="field"><label>Date</label><input id="trDate" type="date"></div></div><button class="btn primary" onclick="saveTourReport()">Save Daily Report</button><div id="tourMsg"></div></div>`;trDate.value=new Date().toISOString().slice(0,10);await loadActivityHistory('tour_reports')}else{b.innerHTML=`<div class="page-card"><h2>CO Reporting</h2><p class="muted">Tick whether the activity was completed.</p><div class="form-grid"><div class="field"><label>LMS Updation</label><select id="lms"><option>Yes</option><option>No</option></select></div><div class="field"><label>Google Form</label><select id="googleForm"><option>Yes</option><option>No</option></select></div><div class="field"><label>Date</label><input id="coDate" type="date"></div></div><button class="btn primary" onclick="saveCOActivity()">Save CO Report</button><div id="coMsg"></div></div>`;coDate.value=new Date().toISOString().slice(0,10);await loadActivityHistory('co_reports')}}
function renderTourPlanCategories(){const cats=[['Liability','Location / Visit Details'],['Loans','Location / Visit Details'],['Govt. Business','Department / Institution / Location'],['3rd Party','Location / Visit Details']];tourPlanEntries={};document.getElementById('tourPlanCategories').innerHTML=cats.map(([cat,ph])=>{tourPlanEntries[cat]=1;return `<div class="tour-category" data-category="${esc(cat)}" style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0"><div style="display:flex;justify-content:space-between;align-items:center"><b>${cat}</b><button type="button" class="btn small" onclick="addTourPlanEntry('${cat.replace(/'/g,"\'")}')">＋ Add More</button></div><div id="entries-${cat.replace(/[^A-Za-z0-9]/g,'-')}"><div class="tour-entry" style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end"><div class="field" style="margin-bottom:0"><label>${ph}</label><input class="tp-entry-input" data-category="${esc(cat)}" placeholder="Enter location / visit details"></div><button type="button" class="btn small" onclick="this.closest('.tour-entry').remove()" title="Remove">−</button></div></div></div>`}).join('')}
let tourPlanEntries={};
function addTourPlanEntry(cat){const id='entries-'+cat.replace(/[^A-Za-z0-9]/g,'-');const box=document.getElementById(id);if(!box)return;const n=(tourPlanEntries[cat]||1)+1;tourPlanEntries[cat]=n;const ph=cat==='Govt. Business'?'Department / Institution / Location':'Location / Visit Details';box.insertAdjacentHTML('beforeend',`<div class="tour-entry" style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end"><div class="field" style="margin-bottom:0"><label>${ph} ${n}</label><input class="tp-entry-input" data-category="${esc(cat)}" placeholder="Enter location / visit details"></div><button type="button" class="btn small" onclick="this.closest('.tour-entry').remove()" title="Remove">−</button></div>`)}

async function saveTourPlan(){try{const entries={};document.querySelectorAll('.tp-entry-input').forEach(el=>{const v=el.value.trim();if(v)(entries[el.dataset.category]??=[]).push(v)});for(const cat of ['Liability','Loans','Govt. Business','3rd Party']){if(!entries[cat]?.length)continue;await api('/api/activity/tour-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:tpDate.value,category:cat,plan:entries[cat].join('\n')})})}tpMsg.innerHTML='<div class="alert success">Tour plan saved.</div>';await activityTab('plan',document.querySelector('.tabs .tab.active'))}catch(e){tpMsg.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function saveTourReport(){const pairs=[['Home Loan',home_loan_no.value,home_loan_amt.value],['Vehicle Loan',vehicle_loan_no.value,vehicle_loan_amt.value],['Other Retail Loan',other_retail_no.value,other_retail_amt.value],['Deposits',deposits_no.value,deposits_amt.value],['3rd Party',third_party_no.value,third_party_amt.value]];for(const [label,no,amt] of pairs){const n=Number(no||0),a=Number(amt||0);if((n>0&&a<=0)||(a>0&&n<=0)){tourMsg.innerHTML=`<div class="alert">${esc(label)}: Lead Number and Lead Amount must both be greater than 0, or both be 0.</div>`;return}}const d={date:trDate.value,home_loan_no:home_loan_no.value,home_loan_amt:home_loan_amt.value,vehicle_loan_no:vehicle_loan_no.value,vehicle_loan_amt:vehicle_loan_amt.value,other_retail_no:other_retail_no.value,other_retail_amt:other_retail_amt.value,builder_tieup:builder_tieup.value,dealer_tieup:dealer_tieup.value,deposits_no:deposits_no.value,deposits_amt:deposits_amt.value,third_party_no:third_party_no.value,third_party_amt:third_party_amt.value};try{await api('/api/activity/tour-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});tourMsg.innerHTML='<div class="alert success">Daily tour report saved.</div>'}catch(e){tourMsg.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function saveCOActivity(){try{await api('/api/activity/co-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:coDate.value,lms:lms.value,google_form:googleForm.value})});coMsg.innerHTML='<div class="alert success">CO report saved.</div>'}catch(e){coMsg.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function loadActivityHistory(key){try{const d=await api('/api/activity');const rows=d[key]||[];const body=document.getElementById('activityBody');const existing=body.querySelector('.page-card');if(!existing)return;let title=key==='tour_plans'?'Saved Tour Plans':key==='tour_reports'?'Saved Tour Reports':'Saved CO Reports';existing.insertAdjacentHTML('beforeend',`<div class="section-card" style="margin-top:16px"><div class="section-title"><h2>${title}</h2></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr>${Object.keys(rows[0]).filter(k=>k!=='user_id').map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr>${Object.entries(r).filter(([k])=>k!=='user_id').map(([k,v])=>`<td>${k.toLowerCase().includes('date')&&v?fmt(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No saved records.</div>'}</div>`)}catch{}}
function renderCO(){const tabs=[['I','Report-I CO Format'],['II','Report-II Retail'],['III','Report-III Savings'],['IV','Report-IV Current'],['V','Report-V Salary'],['VI-D','Report-VI Daily Deposit'],['VI-R','Report-VI Daily Retail']];main.innerHTML=head('CO Report','A4 landscape reports',`<div class="seg"><button class="${state.mode==='monthly'?'active':''}" onclick="state.mode='monthly';loadCO()">Monthly</button><button class="${state.mode==='cumulative'?'active':''}" onclick="state.mode='cumulative';loadCO()">Cumulative</button></div><input class="control" type="date" value="${state.date}" onchange="state.date=this.value;loadCO()">`)+`<div class="page-card"><div class="tabs">${tabs.map(t=>`<button class="tab ${state.coType===t[0]?'active':''}" onclick="state.coType='${t[0]}';loadCO()">${t[1]}</button>`).join('')}</div><div id="coBody"></div></div>`;loadCO()}
async function loadCO(){const b=document.getElementById('coBody');if(!b)return;try{const d=await api(`/api/co-report?report_type=${state.coType}&mode=${state.mode}&report_date=${state.date}&daily_date=${state.date}`);const title=({I:'Report-I CO Format',II:'Report-II Retail',III:'Report-III Savings Account',IV:'Report-IV Current Account',V:'Report-V Salary Account','VI-D':'Report-VI Daily Report Deposit','VI-R':'Report-VI Daily Report Retail'})[state.coType];b.innerHTML=`<div class="report-head"><div><b>${title}</b><div class="muted">${state.coType.startsWith('VI')?'Date: '+fmt(d.date):fmt(d.start)+' to '+fmt(d.end)}</div></div><div><button class="btn small" onclick="downloadCO('excel')">Excel</button><button class="btn small primary" onclick="downloadCO('pdf')">PDF</button><button class="btn small" onclick="window.print()">Print</button></div></div>${coTable(state.coType,d)}` }catch(e){b.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
function coTable(type,d){if(type==='VI-D')return fullTable(d.rows,[['mo','MO Name'],['cac','CAC Name'],['sb_lead','SB Lead No.'],['sb_conv','SB Converted No.'],['cd_lead','CD Lead No.'],['cd_conv','CD Converted No.'],['salary_lead','Salary Lead No.'],['salary_conv','Salary Converted No.']]);if(type==='VI-R'){let rows=d.rows.map(r=>{let o={mo:r.mo,cac:r.cac};['Home Loan','Vehicle Loan','Edu/Personal Loan','Retail Loan'].forEach(k=>{let q=r[k];o[k+' Lead No.']=q.lead_no;o[k+' Conv No.']=q.converted_no;o[k+' Lead Cr']=q.lead_amt_crore;o[k+' Conv Cr']=q.converted_amt_crore});return o});return fullTable(rows,[['mo','MO Name'],['cac','CAC Name'],...['Home Loan','Vehicle Loan','Edu/Personal Loan','Retail Loan'].flatMap(k=>[[k+' Lead No.',k+' Lead No.'],[k+' Conv No.',k+' Converted No.'],[k+' Lead Cr',k+' Lead Amt. Cr'],[k+' Conv Cr',k+' Converted Amt. Cr']])])}const rows=[];for(const r of d.rows){const rt=r.retail_target,ra=r.retail_actual,dt=r.deposit_target,da=r.deposit_actual;const o={mo:r.name,cac:r.cac};if(type==='I'){o.SB_Target=dt.SB;o.SB_Achi=da.SB;o.SB_AchiPct=pct(da.SB,dt.SB);o.CD_Target=dt.CD;o.CD_Achi=da.CD;o.CD_AchiPct=pct(da.CD,dt.CD);o.Salary_Target=dt.Salary;o.Salary_Achi=da.Salary;o.Salary_AchiPct=pct(da.Salary,dt.Salary);o.Retail_Target=Object.values(rt).reduce((a,b)=>a+b,0);o.Retail_Achi=ra['Total Retail'];o.Retail_AchiPct=pct(o.Retail_Achi,o.Retail_Target)}else if(type==='II'){for(const k of ['Home Loan','Vehicle Loan','Education Loan/Personal Loan']){o[k+' Target']=rt[k];o[k+' Achi']=ra[k];o[k+' AchiPct']=pct(ra[k],rt[k])}o['Total Retail Target']=Object.values(rt).reduce((a,b)=>a+b,0);o['Total Retail Achi']=ra['Total Retail'];o['Total Retail AchiPct']=pct(o['Total Retail Achi'],o['Total Retail Target'])}else{const key=({III:'SB',IV:'CD',V:'Salary'})[type];o.Target=dt[key];o.Achi=da[key];o.AchiPct=pct(da[key],dt[key])}rows.push(o)}return fullTable(rows,Object.keys(rows[0]||{}).map(k=>[k,k.replaceAll('_',' ')]))}
function downloadCO(kind){const q=`report_type=${state.coType}&mode=${state.mode}&report_date=${encodeURIComponent(state.date||'')}&daily_date=${encodeURIComponent(state.date||'')}`;window.location.href=`/download/co-${kind==='pdf'?'pdf':'excel'}?${q}`}
async function downloadBlob(url,name){const r=await fetch(url,{credentials:'same-origin'});if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.detail||'Download failed');return}const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
async function renderTargets(){try{const d=await api('/api/targets');let rows=Object.entries(d.targets).map(([name,x])=>({name,...Object.fromEntries(Object.entries(x.retail).map(([k,v])=>[k+' Target Cr',v])),SB:x.deposits.SB,CD:x.deposits.CD,Salary:x.deposits.Salary}));main.innerHTML=head('Targets','Monthly Retail and Deposit target master')+`<div class="page-card"><div class="notice">Retail targets are in ₹ Crore. Deposit targets are account numbers. Targets are maintained for all 22 Marketing Officers.</div><div style="margin-top:15px">${fullTable(rows,Object.keys(rows[0]||{}).map(k=>[k,k]))}</div></div>`}catch(e){main.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function renderUsers(){try{const d=await api('/api/users');main.innerHTML=head('User Management','22 MO users, 3 administrators and admin account')+`<div class="page-card"><div class="notice">Initial IDs and passwords are provisioned automatically. Admin can reset passwords and view the currently stored password, as instructed.</div><div style="margin-top:15px">${fullTable(d.users,[['user_id','User ID'],['name','Name'],['role','Role'],['cac','CAC'],['password','Password']])}</div></div>`}catch(e){main.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
function renderPassword(){main.innerHTML=head('Account','Change your password')+`<div class="page-card" style="max-width:560px"><div class="field"><label>Current Password</label><input id="oldPass" type="password"></div><div class="field"><label>New Password</label><input id="newPass" type="password"></div><button class="btn primary" onclick="changePass()">Change Password</button><div id="passMsg" style="margin-top:12px"></div></div>`}
async function changePass(){try{await api('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:oldPass.value,new_password:newPass.value})});passMsg.innerHTML='<div class="alert success">Password changed successfully.</div>'}catch(e){passMsg.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
(async()=>{try{state.me=await api('/api/me');await boot()}catch{}})();
</script>
